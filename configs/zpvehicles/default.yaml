# dataset
dataset:
  common:
    NAME: TruckBedDataset
    data_root: data/processed
    num_points: 4096
    normalize: True
    augmentation:
      enabled: False
      rotate_z: True
      scale: [0.9, 1.1]
      shift: [0.08, 0.08, 0.03]
      jitter_sigma: 0.008
      jitter_clip: 0.03
      dropout_ratio: 0.08
  train:
    split: train
  val:
    split: val
  test:
    split: test

feature_keys: x
num_classes: 2
batch_size: 8
val_batch_size: 8

dataloader:
  num_workers: 4

datatransforms:
  train: null
  val: null

# training
val_fn: validate
ignore_index: null
epochs: 80
val_freq: 1

cls_weighed_loss: False

criterion_args:
  NAME: CrossEntropy
  label_smoothing: 0.0

optimizer:
  NAME: adamw
  weight_decay: 1.0e-4

sched: cosine
warmup_epochs: 0
min_lr: 1.0e-5
lr: 0.001

grad_norm_clip: 10
use_voting: False

log_dir: zpvehicles
save_freq: -1

wandb:
  project: BRACE-Net
